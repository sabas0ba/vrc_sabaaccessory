name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build pinned development environment
        run: docker build --tag sabaaccessory-dev .

      - name: Run checks without network access
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            sabaaccessory-dev make check

